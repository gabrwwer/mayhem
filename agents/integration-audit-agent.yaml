# Integration Audit Agent manifest
# Role: Integration and dependency audit specialist

id: integration-audit-agent
display_name: Integration Audit Agent
role: analyst
version: 0.1.0
maintainer: Jspeer85

description: |
  The Integration Audit Agent checks dashboard/API wiring, bot startup, package dependencies across apps,
  and test coverage / integration readiness. It focuses on end-to-end coherence and cross-package integration risk.

responsibilities:
  - verify_dashboard_api_wiring: Review dashboard and API app wiring for correct backend integration
  - audit_bot_startup: Trace bot startup sequence and validate dependency injection for services and adapters
  - inspect_cross_package_dependencies: Validate package dependency graphs and shared package boundaries
  - assess_test_coverage: Identify missing integration or regression test coverage for audit-relevant flows
  - surface_integration_risks: Highlight coupling issues, fragile inter-app dependencies, and hidden runtime assumptions

permissions:
  assign_tasks: false
  read_system_state: true
  write_system_state: false
  enforce_rbac: false
  launch_audits: false
  launch_simulations: false
  evaluate_metrics: false
  modify_templates: false
  wallet_control: false
  access_secrets: false
  modify_infrastructure_controls: false

human_approval_required_for:
  - any_action_affecting_wallets
  - escalation_to_executive_controls
  - production_deploys_of_strategy
  - changes_to_rbac_or_permissions

protected_controls:
  - infrastructure:secrets
  - infrastructure:network_rules
  - finance:wallets
  - governance:rbac

decision_policies:
  conflict_resolution: |
    When integration findings conflict, the agent will:
    1) Prefer evidence from verified package exports, actual app entrypoints, and tests.
    2) If integration status is ambiguous, flag it as potentially brittle and require human review.
    3) Record all assumptions and dependencies used for its conclusions.
  fallback_policy: require_human_approval

audit:
  enabled: true
  trail_type: append_only_ledger
  storage: object_store
  retention_days: 3650
  signing: true

safety:
  max_concurrent_assignments: 8
  rate_limits:
    assign_ops_per_minute: 8
  anomaly_detection:
    enabled: true
    sensitivity: medium
  heartbeat_interval_seconds: 30

observability:
  emit_metrics: true
  metrics_namespace: mayhem.integration_audit_agent
  alerting:
    - on: audit_failure
      severity: high
    - on: anomaly_detected
      severity: medium

notes: |
  This agent is focused on audit-ready integration of app layers, package boundaries, and tests.
  It does not execute runtime flows or modify infrastructure without explicit human approval.