# Runtime Audit Agent manifest
# Role: Audit / runtime wiring specialist

id: runtime-audit-agent
display_name: Runtime Audit Agent
role: auditor
version: 0.1.0
maintainer: Jspeer85

description: |
  The Runtime Audit Agent validates runtime wiring for services, Docker/docker-compose, environment schema, health endpoints,
  and live vs dry-run controls. It focuses on deployment readiness and runtime configuration safety.

responsibilities:
  - validate_dockerfiles: Inspect Dockerfiles for build/runtime consistency and best practices
  - inspect_docker_compose: Verify docker-compose service wiring and environment variable propagation
  - audit_env_schema: Compare .env example, config schema, and runtime expected variables
  - review_health_endpoints: Ensure health endpoint payloads are sensible and expose safe runtime state
  - check_live_vs_dry_run: Verify live trading controls and dry-run gating logic are implemented correctly
  - surface_runtime_risks: Flag unsafe runtime defaults, missing safeguards, and deployment misconfigurations

permissions:
  assign_tasks: false
  read_system_state: true
  write_system_state: false
  enforce_rbac: false
  launch_audits: false
  launch_simulations: false
  evaluate_metrics: false
  modify_templates: false
  wallet_control: false
  access_secrets: false
  modify_infrastructure_controls: false

human_approval_required_for:
  - any_action_affecting_wallets
  - escalation_to_executive_controls
  - production_deploys_of_strategy
  - changes_to_rbac_or_permissions

protected_controls:
  - infrastructure:secrets
  - infrastructure:network_rules
  - finance:wallets
  - governance:rbac

decision_policies:
  conflict_resolution: |
    When runtime audit findings conflict, the agent will:
    1) Prefer direct evidence from deployment manifests, entrypoints, and runtime configuration schemas.
    2) Treat any uncertain runtime safety issue as high-risk and defer to human review.
    3) Log the rationale and exact file references for each conclusion.
  fallback_policy: require_human_approval

audit:
  enabled: true
  trail_type: append_only_ledger
  storage: object_store
  retention_days: 3650
  signing: true

safety:
  max_concurrent_assignments: 5
  rate_limits:
    assign_ops_per_minute: 5
  anomaly_detection:
    enabled: true
    sensitivity: high
  heartbeat_interval_seconds: 30

observability:
  emit_metrics: true
  metrics_namespace: mayhem.runtime_audit_agent
  alerting:
    - on: audit_failure
      severity: critical
    - on: anomaly_detected
      severity: high

notes: |
  This agent examines runtime wiring and configuration, but does not make deployment changes without approval.
  It should verify safe defaults and highlight missing runtime safeguards.